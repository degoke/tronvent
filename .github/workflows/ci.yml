name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: tronvent_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tronvent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/tronvent_test?sslmode=disable
      DATABASE_URL: postgres://postgres@localhost:5432/tronvent_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Tidy modules
        run: make tidy

      - name: Format check
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: ./...

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Check Helm chart image tag
        run: |
          # Docker images are tagged without the "v" (0.3.0), so the chart must never render
          # a v-prefixed tag, whichever way appVersion was set when it was packaged.
          set -euo pipefail
          helm lint charts/tronvent --set secrets.databaseUrl=x --set secrets.tronGridApiKey=x
          out="$RUNNER_TEMP/charts"
          mkdir -p "$out"
          for app_version in v9.9.9 9.9.9; do
            helm package charts/tronvent --version 9.9.9 --app-version "$app_version" -d "$out"
            image=$(helm template tronvent "$out/tronvent-9.9.9.tgz" \
              --set secrets.create=false --set secrets.existingSecret=ci \
              | grep -o 'image: "ghcr.io/degoke/tronvent:[^"]*"')
            echo "appVersion=$app_version renders $image"
            test "$image" = 'image: "ghcr.io/degoke/tronvent:9.9.9"'
          done

      - name: Migrate test database
        run: go run ./cmd/migrate

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: tronvent-linux-amd64
          path: bin/tronvent
