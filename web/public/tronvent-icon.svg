      <line class="speed-red" x1="350" y1="240" x2="470" y2="240"/>
      <line class="speed-red" x1="315" y1="265" x2="430" y2="265" opacity="0.92"/>
      <line class="speed-silver" x1="120" y1="300" x2="180" y2="300"/>
