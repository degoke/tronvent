    <path filter="url(#redGlow)" d="M84 122 L426 122 L378 168 L312 168 L250 250 L188 168 L132 168 Z M164 168 L250 283 L336 168 L390 168 L250 340 L110 168 Z" fill="url(#redGrad)"/>
