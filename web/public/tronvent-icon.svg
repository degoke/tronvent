<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450" fill="none">
  <defs>
    <linearGradient id="redGrad" x1="180" y1="70" x2="360" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF2233"/>
      <stop offset="1" stop-color="#D40013"/>
    </linearGradient>
    <linearGradient id="darkRedGrad" x1="215" y1="122" x2="340" y2="245" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8F000B"/>
      <stop offset="1" stop-color="#4A0004"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="230" y1="300" x2="340" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7F9FB"/>
      <stop offset="0.5" stop-color="#C9D0D8"/>
      <stop offset="1" stop-color="#7C8794"/>
    </linearGradient>
    <filter id="redGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.95  0 1 0 0 0.06  0 0 1 0 0.12  0 0 0 0.9 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="silverGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.85  0 1 0 0 0.89  0 0 1 0 0.94  0 0 0 0.55 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .speed-red { stroke: #FF1E2D; stroke-width: 8; stroke-linecap: round; opacity: 0.98; }
      .speed-silver { stroke: #9DA7B4; stroke-width: 8; stroke-linecap: round; opacity: 0.85; }
    </style>
  </defs>
  <g transform="translate(60 35)">
